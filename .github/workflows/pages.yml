name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.148.2
      HUGO_ENVIRONMENT: production
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Hugo CLI
        run: |
          wget -O "${RUNNER_TEMP}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
          hugo version

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Resolve Hugo modules
        env:
          HUGO_MODULES_TOKEN: ${{ secrets.HUGO_MODULES_TOKEN != '' && secrets.HUGO_MODULES_TOKEN || github.token }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ env.HUGO_MODULES_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          GONOSUMDB: github.com/Partner-Offering-Catalog/*
          GOPRIVATE: github.com/Partner-Offering-Catalog/*
        run: hugo mod get github.com/Partner-Offering-Catalog/static-page-template@main

      - name: Build with Hugo
        env:
          HUGO_MODULES_TOKEN: ${{ secrets.HUGO_MODULES_TOKEN != '' && secrets.HUGO_MODULES_TOKEN || github.token }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ env.HUGO_MODULES_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          GONOSUMDB: github.com/Partner-Offering-Catalog/*
          GOPRIVATE: github.com/Partner-Offering-Catalog/*
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
