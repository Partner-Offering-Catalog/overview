name: Deploy site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TEMPLATE_REPOSITORY: Partner-Offering-Catalog/static-page-template
      TEMPLATE_REF: main
      TEMPLATE_DIR: .static-page-template
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Checkout static page template
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.TEMPLATE_REPOSITORY }}
          ref: ${{ env.TEMPLATE_REF }}
          path: ${{ env.TEMPLATE_DIR }}
          token: ${{ secrets.SITE_TEMPLATE_TOKEN || secrets.HUGO_MODULES_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.TEMPLATE_DIR }}/package-lock.json

      - name: Install template dependencies
        working-directory: ${{ env.TEMPLATE_DIR }}
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Stage repository content
        run: |
          rm -rf "${TEMPLATE_DIR}/content"
          cp -R content "${TEMPLATE_DIR}/content"
          cp site.config.json "${TEMPLATE_DIR}/site.config.json"

          # Non-Markdown files stay next to the offering page they belong to, so
          # copy them into the template's static tree at the same relative path
          # to keep links from an offering page working.
          mkdir -p "${TEMPLATE_DIR}/static"
          cp -R content/. "${TEMPLATE_DIR}/static/"
          find "${TEMPLATE_DIR}/static" -name '*.md' -delete
          find "${TEMPLATE_DIR}/static" -type d -empty -delete

      - name: Build site
        working-directory: ${{ env.TEMPLATE_DIR }}
        env:
          BASE_URL: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ env.TEMPLATE_DIR }}/public

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
